name: Build Menly Native Android APK
on:
  push:
    branches:
      - menly-android-preview
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload Menly APK
        uses: actions/upload-artifact@v4
        with:
          name: Menly-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
